display_information:
  name: Vestaprime Market Poster
  description: Canli piyasa posterini otomatik olarak kanala gonderir.
  background_color: "#0b0d11"
features:
  bot_user:
    display_name: Vestaprime Market Poster
    always_online: true
oauth_config:
  scopes:
    bot:
      - files:write
      - chat:write
      # Gunun Tahmini oylamasi oylari emoji tepkilerinden okuyor. Bu scope
      # olmadan oylama paylasilir, acilis fiyati yakalanir, ama sonuc
      # aciklanamaz: reactions.get "missing_scope" doner ve is hata verir.
      - reactions:read
      # Oy seceneklerinin emojilerini mesaja onceden koymak icin. Olmadigi
      # surece oylama tikanacak secenek olmadan paylasiliyor - 26 Agustos
      # oylamasinin sifir oy almasinin sebebi buydu. Eksikligi sessiz: kod
      # reactions.add hatasini yutup yalnizca uyari basiyor.
      - reactions:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
