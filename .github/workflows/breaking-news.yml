name: Son Dakika -> Slack

on:
  schedule:
    # Saatler UTC. Turkiye UTC+3.
    # ABD piyasasi acikken (TR 16:00-24:00, hafta ici) 10 dakikada bir:
    - cron: '*/10 13-20 * * 1-5'
    # Hafta ici diger saatlerde 30 dakikada bir:
    - cron: '*/30 0-12,21-23 * * 1-5'
    # Hafta sonu (kripto 7/24 aktif) 30 dakikada bir:
    - cron: '*/30 * * * 0,6'
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: 'Kac saatlik haberler degerlendirilsin (elle test icin)'
        required: false
        default: '3'
      dry_run:
        description: 'Slack e gonderme, sadece ne gidecegini yazdir'
        type: boolean
        required: false
        default: false

# Ayni anda iki calistirma olursa state dosyasi cakisir; siraya alinir.
concurrency:
  group: breaking-news
  cancel-in-progress: false

permissions:
  contents: write # gonderilen haber gecmisini repoya geri yazmak icin

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Bagimliliklari kur
        run: npm ci

      - name: Haberleri tara ve gonder
        run: node src/news/index.js ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NEWS_CHANNEL_ID: ${{ secrets.NEWS_CHANNEL_ID }}
          NEWS_MAX_AGE_HOURS: ${{ inputs.max_age_hours || '3' }}

      - name: Gonderim gecmisini kaydet
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "Gecmiste degisiklik yok, commit atlanacak."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "chore: gonderilen son dakika haberlerini kaydet [skip ci]"
          # Bu sirada baska bir commit girmis olabilir; once uzaktakini al.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
