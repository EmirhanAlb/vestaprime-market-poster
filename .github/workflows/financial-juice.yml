name: FinancialJuice -> Slack

# NEDEN CRON DEGIL DE UZUN CALISAN IS?
#
# GitHub'in zamanlayicisi sik cron'lari guvenilir calistirmiyor. Bu repoda
# olculen davranis: '5 dakikada bir' ayari 86 dakikada SIFIR calistirma
# uretti; saatlik ve 10 dakikalik ayarlar ise ~2.5 saatte bire dustu. Repo
# public oldugu icin dakika kotasi degil, planlayici onceliklendirmesi.
#
# Cozum: tek bir uzun is icinde 5 dakikada bir yoklamak ve is bitiminde
# workflow'un kendini yeniden tetiklemesi. workflow_dispatch, GITHUB_TOKEN
# ile tetiklendiginde yeni calistirma uretebilen iki olaydan biri.

on:
  schedule:
    # Yalnizca guvenlik agi: zincir bir sekilde kopmussa yeniden baslatir.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Slack e gonderme, sadece ne gidecegini yazdir'
        type: boolean
        required: false
        default: false
      loop_minutes:
        description: 'Dongunun surecegi dakika (0 = tek tur)'
        required: false
        default: '300'

# Ayni anda tek is calisir. Zamanlanmis tetikleme uzun is surerken gelirse
# beklemede kalir ve is bitince zinciri devralir; ikinci bir zincir olusmaz.
concurrency:
  group: financial-juice
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # is bitiminde kendini yeniden tetiklemek icin

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Gecmis repoya commit'lenmiyor (5 dakikalik is gunde ~288 commit
      # demek olurdu); Actions cache kullaniliyor.
      # Anahtarda kanal adi var: kaynak kanal degistiginde eski gecmis geri
      # YUKLENMEMELI. Yuklenirse yeni kanalin sayfadaki tum basliklari birden
      # "yeni" sayilir ve tek turda 15 mesajlik akin olur. Anahtar degisince
      # gecmis bos gelir ve akis ilk-calistirma yoluna girip yalnizca en yeni
      # birkac basligi gonderir.
      - name: Gonderim gecmisini geri yukle
        uses: actions/cache@v4
        with:
          path: state/seen-telegram.json
          key: fj-state-${{ vars.TELEGRAM_CHANNEL || 'FinancialJuice' }}-${{ github.run_id }}
          restore-keys: fj-state-${{ vars.TELEGRAM_CHANNEL || 'FinancialJuice' }}-

      - name: Bagimliliklari kur
        run: npm ci

      - name: Telegram akisini aktar (dongu)
        run: node src/telegram/index.js --loop ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # Tum Slack workspace'leri ve kanallari tek JSON secret'ta.
          SLACK_CONFIG: ${{ secrets.SLACK_CONFIG }}
          # Tum Telegram botlari ve kanallari tek JSON secret'ta.
          # Yeni kanal eklemek icin yalnizca bu secret guncellenir.
          TELEGRAM_CONFIG: ${{ secrets.TELEGRAM_CONFIG }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          # OKUNAN kaynak kanal (yukaridaki TELEGRAM_CHANNEL_ID ise Slack
          # hedefi - isimler benziyor, karistirmayin). Kaynagi degistirmek
          # icin repo degiskeni TELEGRAM_CHANNEL'i guncellemek yeterli.
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL || 'FinancialJuice' }}
          TRANSLATOR: ${{ vars.TRANSLATOR || 'free' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOOP_SECONDS: ${{ vars.LOOP_SECONDS || '300' }}
          LOOP_MINUTES: ${{ inputs.loop_minutes || '300' }}
          TELEGRAM_MAX_PER_RUN: '15'

      # Is basarisiz bitse bile zincir devam etmeli; aksi halde tek bir
      # gecici hata akisi kalici olarak durdururdu.
      - name: Zinciri devam ettir
        if: ${{ always() && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "FinancialJuice -> Slack" --ref "${{ github.ref_name }}"
